services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "8080:80"

  api:
    image: nginx:alpine
    ports:
      - "8081:80"
    depends_on:
      - db
